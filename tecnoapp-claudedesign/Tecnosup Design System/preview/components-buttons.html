<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #030407; font-family: 'Segoe UI', system-ui, sans-serif; padding: 20px 24px; display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .label { color: #444; font-size: 9px; font-family: 'Consolas', monospace; letter-spacing: 1px; width: 100%; margin-bottom: -6px; }
  button { cursor: pointer; font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 700; }
</style>
</head>
<body>
  <div class="label">PRIMARY — ActionBtn</div>
  <div class="row">
    <button style="background:#0eb3ff;color:#000;border:none;border-radius:8px;padding:12px 28px;font-size:14px;box-shadow:0 0 14px rgba(14,179,255,0.5)">INICIAR LIMPEZA</button>
    <button style="background:#0eb3ff;color:#000;border:none;border-radius:8px;padding:12px 28px;font-size:14px;opacity:.45">DESATIVADO</button>
  </div>

  <div class="label">MENU — MenuBtn (default / hover)</div>
  <div class="row">
    <button style="background:transparent;border:1px solid rgba(14,179,255,0.25);color:#fff;border-radius:8px;padding:9px 16px;font-size:11px">LIMPEZA</button>
    <button style="background:rgba(14,179,255,0.10);border:1px solid #0eb3ff;color:#0eb3ff;border-radius:8px;padding:9px 16px;font-size:11px">OTIMIZAÇÃO</button>
  </div>

  <div class="label">GAMER — gradient left→right</div>
  <div class="row">
    <button style="background:linear-gradient(90deg,#0eb3ff,#7000ff);color:#fff;border:none;border-radius:8px;padding:9px 16px;font-size:11px">MODO GAMER</button>
    <button style="background:linear-gradient(90deg,#2dc3ff,#8a2bff);color:#fff;border:none;border-radius:8px;padding:9px 16px;font-size:11px">MODO GAMER :hover</button>
  </div>

  <div class="label">SECONDARY — outline cyan</div>
  <div class="row">
    <button style="background:rgba(14,179,255,0.1);border:1px solid #0eb3ff;color:#0eb3ff;border-radius:6px;padding:6px 14px;font-size:11px;font-weight:700">Configurar →</button>
  </div>

  <div class="label">EXIT / DANGER</div>
  <div class="row">
    <button style="background:transparent;border:1px solid #ff4b4b;color:#ff4b4b;border-radius:8px;padding:8px 24px;font-size:12px;font-weight:700">SAIR</button>
    <button style="background:#ff4b4b;border:none;color:#fff;border-radius:8px;padding:8px 24px;font-size:12px;font-weight:700">SAIR :hover</button>
  </div>

  <div class="label">RESTORE — green subtle</div>
  <div class="row">
    <button style="background:transparent;border:1px solid #2a3a2a;color:#4caf50;border-radius:8px;padding:6px 14px;font-size:10px">Criar Ponto de Restauração</button>
  </div>
</body>
</html>
