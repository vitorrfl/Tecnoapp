<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #030407; display: flex; align-items: center; justify-content: center; gap: 40px; padding: 30px; flex-wrap: wrap; }
  .bg-light { background: #f0f4f8; border-radius: 12px; padding: 20px 32px; }
  .note { color: #444; font-size: 9px; font-family: 'Consolas', monospace; text-align: center; margin-top: 8px; }
</style>
</head>
<body>
  <div>
    <img src="../assets/logo.png" style="width:220px;display:block">
    <div class="note">on dark (native)</div>
  </div>
  <div class="bg-light">
    <img src="../assets/logo.png" style="width:180px;display:block">
    <div class="note" style="color:#aaa">on light (avoid)</div>
  </div>
  <div>
    <img src="../assets/logo.png" style="width:120px;display:block">
    <div class="note">sidebar size (120px)</div>
  </div>
</body>
</html>
