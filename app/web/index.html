<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TecnoApp — Tecnosup</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&amp;family=Share+Tech+Mono&amp;display=swap" rel="stylesheet">

<script src="vendor/react.development.js"></script>
<script src="vendor/react-dom.development.js"></script>
<script src="vendor/babel.min.js"></script>
<script src="vendor/lucide.min.js"></script>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body, #root { width: 100%; height: 100%; background: #030407; }
  body { font-family: 'Segoe UI', 'Rajdhani', system-ui, sans-serif; overflow: hidden; }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: #111; border-radius: 3px; }
  ::-webkit-scrollbar-thumb { background: #0eb3ff; border-radius: 3px; }

  input[type="checkbox"] { accent-color: #0eb3ff; cursor: pointer; }
  input[type="checkbox"]:focus { outline: none; }

  .sb-menu-btn {
    background: transparent;
    border: 1px solid rgba(14,179,255,0.15);
    color: #666;
    font-family: 'Segoe UI','Rajdhani',system-ui,sans-serif;
    font-size: 11px; font-weight: 700;
    border-radius: 8px; padding: 9px 12px;
    text-align: left; cursor: pointer; width: 100%;
    position: relative; overflow: hidden;
    transition: color .2s, border-color .25s, background .2s;
    letter-spacing: .3px;
    display: flex; align-items: center; gap: 8px;
  }
  .sb-menu-btn svg { flex-shrink: 0; transition: stroke .2s; }
  .sb-menu-btn::before {
    content:''; position:absolute; top:0; left:-100%;
    width:60%; height:100%;
    background: linear-gradient(90deg,transparent,rgba(14,179,255,.09),transparent);
    transition: left .42s ease; pointer-events:none;
  }
  .sb-menu-btn::after {
    content:''; position:absolute; top:20%; left:0;
    width:2px; height:60%; border-radius:2px;
    background:#0eb3ff; opacity:0; transform:scaleY(0);
    transition: opacity .2s, transform .22s ease; pointer-events:none;
  }
  .sb-menu-btn:hover { background:rgba(14,179,255,.06); border-color:rgba(14,179,255,.45); color:#fff; }
  .sb-menu-btn:hover svg { stroke:#0eb3ff !important; }
  .sb-menu-btn:hover::before { left:150%; }
  .sb-menu-btn:hover::after  { opacity:1; transform:scaleY(1); }
  .sb-menu-btn:active { background:rgba(14,179,255,.12); transform:scale(.98); }
  .sb-menu-btn.sb-active {
    background:rgba(14,179,255,.08); border-color:rgba(14,179,255,.5);
    color:#0eb3ff; text-shadow:0 0 10px rgba(14,179,255,.35);
  }
  .sb-menu-btn.sb-active svg { stroke:#0eb3ff !important; }
  .sb-menu-btn.sb-active::after { opacity:1; transform:scaleY(1); }

  .sb-gamer-btn {
    color:#fff; font-family:'Segoe UI','Rajdhani',system-ui,sans-serif;
    font-size:11px; font-weight:700; border:none; border-radius:8px;
    padding:9px 12px; text-align:left; cursor:pointer; width:100%;
    position:relative; overflow:hidden;
    background:linear-gradient(90deg,#0eb3ff 0%,#7000ff 100%);
    display:flex; align-items:center; gap:8px;
  }

  .sb-logo { text-align:center; padding:4px 8px 10px; cursor:pointer; display:flex; justify-content:center; }
  .sb-logo img {
    width:160px;
    transition: transform .5s cubic-bezier(.34,1.56,.64,1), filter .5s ease;
    filter: drop-shadow(0 0 6px rgba(14,179,255,.25));
  }
  .sb-logo:hover img { transform:scale(1.06); filter:drop-shadow(0 0 14px rgba(14,179,255,.65)); }
  .sb-logo:active img { transform:scale(.98); }

  .sb-restore-btn {
    background:transparent; border:1px solid rgba(14,179,255,.15);
    color:#555; border-radius:8px; font-size:10px; font-weight:600;
    padding:7px 10px; width:100%; cursor:pointer;
    font-family:'Segoe UI','Rajdhani',system-ui,sans-serif;
    transition: color .2s, border-color .25s, background .2s, box-shadow .2s;
    position:relative; overflow:hidden;
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .sb-restore-btn::before {
    content:''; position:absolute; top:0; left:-100%;
    width:60%; height:100%;
    background:linear-gradient(90deg,transparent,rgba(14,179,255,.07),transparent);
    transition:left .45s ease; pointer-events:none;
  }
  .sb-restore-btn::after {
    content:''; position:absolute; top:20%; left:0;
    width:2px; height:60%; border-radius:2px; background:#0eb3ff;
    opacity:0; transform:scaleY(0);
    transition: opacity .2s, transform .22s ease; pointer-events:none;
  }
  .sb-restore-btn:hover { color:#ccd2e0; border-color:rgba(14,179,255,.45); background:rgba(14,179,255,.05); box-shadow:0 0 10px rgba(14,179,255,.08); }
  .sb-restore-btn:hover::before { left:150%; }
  .sb-restore-btn:hover::after  { opacity:1; transform:scaleY(1); }

  .sb-exit-btn {
    background:transparent; border:1px solid rgba(255,75,75,.25);
    color:#555; border-radius:8px; font-weight:700; padding:8px; width:100%;
    cursor:pointer; font-family:'Segoe UI','Rajdhani',system-ui,sans-serif;
    font-size:11px; letter-spacing:1px;
    transition: color .2s, border-color .25s, background .2s, box-shadow .2s;
    position:relative; overflow:hidden;
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .sb-exit-btn::before {
    content:''; position:absolute; top:0; left:-100%;
    width:60%; height:100%;
    background:linear-gradient(90deg,transparent,rgba(255,75,75,.10),transparent);
    transition:left .45s ease; pointer-events:none;
  }
  .sb-exit-btn::after {
    content:''; position:absolute; top:20%; left:0;
    width:2px; height:60%; border-radius:2px; background:#ff4b4b;
    opacity:0; transform:scaleY(0);
    transition: opacity .2s, transform .22s ease; pointer-events:none;
  }
  .sb-exit-btn:hover { color:#fff; border-color:#ff4b4b; background:rgba(255,75,75,.28); box-shadow:0 0 14px rgba(255,75,75,.30); }
  .sb-exit-btn:hover::before { left:150%; }
  .sb-exit-btn:hover::after  { opacity:1; transform:scaleY(1); }
  .sb-exit-btn:active { transform:scale(.97); }

  .mod-btn {
    background: transparent;
    border: 1px solid rgba(14,179,255,0.18);
    color: #555;
    font-family: 'Segoe UI','Rajdhani',system-ui,sans-serif;
    font-size: 11px; font-weight: 700;
    border-radius: 6px; padding: 7px 12px;
    cursor: pointer; width: 100%; margin-top: auto;
    position: relative; overflow: hidden;
    transition: color .2s, border-color .25s, background .2s;
    letter-spacing: .3px;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .mod-btn::before {
    content:''; position:absolute; top:0; left:-100%;
    width:60%; height:100%;
    background: linear-gradient(90deg,transparent,rgba(14,179,255,.09),transparent);
    transition: left .42s ease; pointer-events:none;
  }
  .mod-btn::after {
    content:''; position:absolute; top:20%; left:0;
    width:2px; height:60%; border-radius:2px;
    background:#0eb3ff; opacity:0; transform:scaleY(0);
    transition: opacity .2s, transform .22s ease; pointer-events:none;
  }
  .mod-btn:hover { background:rgba(14,179,255,.06); border-color:rgba(14,179,255,.5); color:#fff; }
  .mod-btn:hover::before { left:150%; }
  .mod-btn:hover::after  { opacity:1; transform:scaleY(1); }
  .mod-btn:active { background:rgba(14,179,255,.12); transform:scale(.98); }

  .mod-btn-gamer {
    background: linear-gradient(90deg,#0eb3ff 0%,#7000ff 100%);
    border: none; color: #fff;
    font-family: 'Segoe UI','Rajdhani',system-ui,sans-serif;
    font-size: 11px; font-weight: 700;
    border-radius: 6px; padding: 7px 12px;
    cursor: pointer; width: 100%; margin-top: auto;
    position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }

  .status-bar {
    height: 28px;
    background: rgba(3,4,7,0.97);
    border-top: 1px solid rgba(14,179,255,0.08);
    display: flex;
    align-items: center;
    padding: 0 20px;
    font-family: 'Consolas', 'Share Tech Mono', monospace;
    font-size: 10px;
    color: #0eb3ff;
    flex-shrink: 0;
  }

  #boot-overlay {
    position: fixed; inset: 0; display: flex;
    align-items: center; justify-content: center;
    background: #030407; color: #0eb3ff;
    font-family: 'Consolas', monospace; font-size: 11px;
    z-index: 9999; transition: opacity .25s ease;
  }
</style>
</head>
<body>
  <div id="boot-overlay">&gt; iniciando bridge...</div>
  <div id="root"></div>

  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <script src="bridge_init.js"></script>

  <script type="text/babel" src="Tokens.jsx"></script>
  <script type="text/babel" src="Sidebar.jsx"></script>
  <script type="text/babel" src="HomeScreen.jsx"></script>
  <script type="text/babel" src="LimpezaScreen.jsx"></script>
  <script type="text/babel" src="OtimizacaoScreen.jsx"></script>
  <script type="text/babel" src="ReparosScreen.jsx"></script>
  <script type="text/babel" src="SpecsScreen.jsx"></script>
  <script type="text/babel" src="GamerScreen.jsx"></script>

  <script type="text/babel" data-presets="react">
    function App() {
      const [screen, setScreen] = React.useState('home');

      React.useEffect(() => {
        const h = (e) => setScreen(e.detail);
        window.addEventListener('navigate', h);
        return () => window.removeEventListener('navigate', h);
      }, []);

      const screens = {
        home:       <HomeScreen />,
        limpeza:    <LimpezaScreen />,
        otimizacao: <OtimizacaoScreen />,
        reparos:    <ReparosScreen />,
        specs:      <SpecsScreen />,
        gamer:      <GamerScreen />,
      };

      const statusMessages = {
        home:       '> Sistema verificado — nenhuma ação pendente.',
        limpeza:    '> Nenhuma limpeza realizada ainda.',
        otimizacao: '> Tweaks persistentes — revertidos a qualquer momento.',
        reparos:    '> Selecione uma ferramenta para executar.',
        specs:      '> Hardware detectado automaticamente.',
        gamer:      '> Modo Gamer inativo.',
      };

      const appStyle = {
        display: 'flex', flexDirection: 'column',
        width: '100%', height: '100%',
        background: '#030407',
        backgroundImage: 'url(assets/bg_grid.png)',
        backgroundRepeat: 'repeat',
        backgroundSize: '40px 40px',
        backgroundAttachment: 'fixed',
      };

      function handleNavigate(s) {
        setScreen(s);
        if (s === 'gamer' && window.bridge && window.bridge.openGamer) {
          // future: route to native gamer engine if needed
        }
      }

      return (
        <div style={appStyle}>
          <div style={{display:'flex', flex:1, overflow:'hidden'}}>
            <Sidebar active={screen} onNavigate={handleNavigate} />
            <div style={{flex:1, overflow:'hidden', display:'flex', flexDirection:'column'}}>
              <div style={{flex:1, overflow:'hidden'}}>
                {screens[screen] || screens.home}
              </div>
            </div>
          </div>
          <div className="status-bar">
            {statusMessages[screen] || '> Tecnosup · Soluções Digitais'}
          </div>
        </div>
      );
    }

    function mount() {
      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
      const overlay = document.getElementById('boot-overlay');
      if (overlay) {
        overlay.style.opacity = '0';
        setTimeout(() => overlay.remove(), 280);
      }
    }

    if (window.__bridgeReady) {
      mount();
    } else {
      window.addEventListener('bridge-ready', mount, { once: true });
      // Fallback: if bridge fails to connect after 3s, mount anyway with mock data
      setTimeout(() => {
        if (!document.getElementById('root').hasChildNodes()) {
          console.warn('[TecnoApp] bridge timeout — mounting with mock data');
          mount();
        }
      }, 3000);
    }
  </script>
</body>
</html>
